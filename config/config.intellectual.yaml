# ChamberCheck — "Intellectual Podcast" Configuration
# Subreddits: long-form / intellectual podcast communities
# API keys and secrets go in .env, never here.

scraping:
  num_posts: 500
  sort_method: top
  time_filter: all
  start_date: 2019-01-01
  end_date: null
  rate_limit_delay: 3
  min_comments: 200
  retry_on_429: true
  max_retries: 20
  retry_wait_seconds: 60
  subreddits:
    - samharris
    - decodingthegurus
    - lexfridman
    - HubermanLab
    - philosophy

post_analysis:
  provider: anthropic
  model: claude-3-haiku-20240307
  temperature: 0.1
  max_tokens: 500

preprocessing:
  top_n_per_subreddit: 30
  min_discussion_score: 0.6
  min_topic_peers: 1
  exclude_topics:
    - UNCLEAR

comment_scraping:
  window_days: 3

comment_preprocessing:
  max_sample_per_post: 100
  min_content_length: 20

comment_analysis:
  provider: anthropic
  model: claude-haiku-4-5-20251001
  temperature: 0.1
  max_tokens: 500
  rate_limit_delay: 0.5
  max_retries: 3
  retry_wait_seconds: 5
  include_rationale: false   # omit stance/epistemic rationale strings (~25-30% output token saving)

scoring:
  # placeholder — parameters to be defined when scoring pipeline is implemented
