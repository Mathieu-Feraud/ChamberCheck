[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chambercheck"
version = "0.1.0"
description = "LLM-powered research tool for quantifying echo chamber dynamics in online communities through discourse analysis"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "ChamberCheck Team"}
]
keywords = ["echo-chamber", "social-media", "discourse-analysis", "reddit", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Sociology",
    "Topic :: Text Processing :: Linguistic",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Core dependencies
    "praw>=7.7.0",  # Reddit API wrapper
    "pandas>=2.0.0",  # Data manipulation
    "numpy>=1.24.0",  # Numerical operations
    "scipy>=1.10.0",  # Statistical functions (Spearman correlation)
    "beautifulsoup4>=4.12.0",  # HTML parsing
    "requests>=2.31.0",  # HTTP requests
    
    # NLP and ML
    "transformers>=4.30.0",  # Hugging Face transformers for embeddings
    "sentence-transformers>=2.2.0",  # Sentence embeddings
    "scikit-learn>=1.3.0",  # Machine learning utilities
    "nltk>=3.8.0",  # Natural language toolkit
    "spacy>=3.5.0",  # Advanced NLP
    
    # LLM Integration (optional)
    "openai>=1.0.0",  # OpenAI API
    "anthropic>=0.18.0",  # Anthropic API
    
    # Data storage and formats
    "jsonlines>=4.0.0",  # JSONL format support
    "pyarrow>=12.0.0",  # Parquet support for pandas
    "pyyaml>=6.0.0",  # YAML config file support
    
    # Visualization
    "matplotlib>=3.7.0",  # Plotting
    "seaborn>=0.12.0",  # Statistical visualization
    "plotly>=5.14.0",  # Interactive plots
    
    # Utilities
    "python-dotenv>=1.0.0",  # Environment variable management
    "tqdm>=4.65.0",  # Progress bars
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/Mathieu-Feraud/ChamberCheck"
Repository = "https://github.com/Mathieu-Feraud/ChamberCheck"
Documentation = "https://github.com/Mathieu-Feraud/ChamberCheck/blob/main/README.md"
Issues = "https://github.com/Mathieu-Feraud/ChamberCheck/issues"

[project.scripts]
chambercheck = "ChamberCheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=chambercheck --cov-report=term-missing"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
